# Compose local/VPS pour lancer SICORE frontend + backend + MySQL.
# A lancer depuis le dossier sicoreFront/sicoreFront.
# Le chemin du backend suppose l'arborescence suivante:
# Downloads/sicoreFront/sicoreFront et Downloads/sicoreBack/sicoreBack.
services:
  mysql:
    image: mysql:8.4
    container_name: sicore_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sicore}
      MYSQL_USER: ${MYSQL_USER:-sicore_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_db_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
    ports:
      - "3306:3306"
    volumes:
      - sicore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../sicoreBack/sicoreBack
      dockerfile: Dockerfile
    container_name: sicore_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: ../../sicoreBack/sicoreBack/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8081:8080"
    volumes:
      - backend_storage:/var/www/html/storage

  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: sicore_frontend
  #   restart: unless-stopped
