name: CI/CD Pipeline Backend Laravel

on:
  push:
    branches: ["deploy"]

  pull_request:
    branches: ["deploy"]

jobs:

  # ==========================================================
  # 1. CONTINUOUS DEPLOYMENT (DÉPLOIEMENT DIRECT)
  # ==========================================================
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    if: >
      github.ref == 'refs/heads/deploy' &&
      github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # --------------------------------------------------------
      # Build & Push
      # --------------------------------------------------------
      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sicore-back:latest
            ${{ secrets.DOCKER_USERNAME }}/sicore-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Deploy VPS
      # --------------------------------------------------------
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo "======================================"
            echo "DEPLOIEMENT BACKEND SICORE"
            echo "======================================"

            cd /var/www/sicore-back
            echo "Répertoire :"
            pwd

            echo "Pull de la nouvelle image Docker..."
            docker compose -f docker-compose-backend.yml pull

            echo "Démarrage des containers..."
            docker compose -f docker-compose-backend.yml up -d

            echo "État des containers :"
            docker compose -f docker-compose-backend.yml ps

            echo "Attente du démarrage du backend..."
            sleep 10

            echo "======================================"
            echo "EXECUTION DES MIGRATIONS"
            echo "======================================"
            docker compose -f docker-compose-backend.yml exec -T app php artisan migrate --force

            echo "======================================"
            echo "EXECUTION DES SEEDERS"
            echo "======================================"
            docker compose -f docker-compose-backend.yml exec -T app php artisan db:seed --force
