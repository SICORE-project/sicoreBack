name: CI/CD Backend

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - deploy

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. TESTS LARAVEL
  # ==========================================================
  ci:
    name: Tests Laravel API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sicore_test
          MYSQL_USER: sicore_user
          MYSQL_PASSWORD: sicore_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifier composer.json
        run: composer validate --no-check-publish --strict

      - name: Mettre en cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Installer les dependances PHP
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Installer les dependances Node
        run: npm install

      - name: Compiler les assets
        run: npm run build

      - name: Preparer Laravel pour les tests
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Lancer les tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sicore_test
          DB_USERNAME: sicore_user
          DB_PASSWORD: sicore_password
        run: composer test

  # ==========================================================
  # 2. BUILD + PUSH IMAGE DOCKER (SUR DOCKER HUB)
  # ==========================================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier Dockerfile
        run: |
          echo "Vérification Dockerfile :"
          test -f ./Dockerfile

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            olalesam/sicore-backend:latest
            olalesam/sicore-backend:${{ github.sha }}

  # ==========================================================
  # 3. DEPLOY VPS
  # ==========================================================
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - ci
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    steps:
      - name: Deployer sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            echo "======================================"
            echo "Déploiement SICORE Backend via Docker Hub"
            echo "======================================"

            cd "${{ secrets.DEPLOY_PATH }}"

            # 1. Gestion automatique de l'arborescence Git locale sur le VPS
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com{{ github.repository }}.git
            fi

            git fetch origin deploy
            git reset --hard origin/deploy

            # 2. Connexion sécurisée à Docker Hub depuis le VPS
            echo "Connexion à Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. Télécharger la nouvelle image
            echo "Téléchargement de la nouvelle image..."
            docker compose -f docker-compose-backend.yml pull

            # 4. Relancer les conteneurs (sans compiler localement)
            echo "Démarrage des conteneurs..."
            docker compose -f docker-compose-backend.yml up -d --no-build

            # 5. Nettoyage de l'espace disque
            docker image prune -f

            # 6. Rafraîchissement des migrations et exécution des seeders Laravel
            echo "Réinitialisation de la base de données (Refresh Migrations)..."
            docker compose -f docker-compose-backend.yml exec -T backend php artisan migrate:refresh --force

            echo "Exécution des Seeders..."
            docker compose -f docker-compose-backend.yml exec -T backend php artisan db:seed --force
